name: "muon_rms_cosine_2000"
optimizer: "muon_rms_to_rms"
muon_lr: 0.002
muon_weight_decay: 0.0
muon_momentum: 0.95
muon_nesterov: true
muon_ns_steps: 5
muon_ns_coefficients: [3.4445, -4.775, 2.0315]
muon_eps: 1.0e-07
muon_scaling_mode: "rms_to_rms"
adjust_lr_fn: "spectral_unclamped"
adamw_lr: 0.001
adamw_weight_decay: 0.01
adamw_betas: [0.9, 0.999]
scheduler: "cosine"
total_training_steps: 2000
lr_schedule_steps: 10000
max_lr: 0.001
min_lr: 0.0001
warmup_steps: 500
gradient_clip_norm: 1.0
batch_size: 128
sequence_length: 256
gradient_accumulation_steps: 1
amp: "bfloat16"
compile: true
train_path: "./train.bin"
val_path: "./val.bin"
vocab_size: 8983
d_model: 512
d_ffn: 1344
num_layers: 4
num_heads: 16
max_seq_len: 512
save_interval: 1000
log_interval: 100
eval_interval: 100
